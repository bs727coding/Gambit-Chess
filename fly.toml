# Fly.io configuration for the Gambit online server (see docs/ONLINE.md).
# App names are global: change `app` before the first deploy. Then:
#   fly launch --copy-config --no-deploy        # create the app from this file
#   fly volumes create gambit_data --size 3     # database + releases survive restarts
#   fly deploy --ha=false                       # exactly ONE machine: games live in its memory
app = "gambit-chess-change-me"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's proxy forwards the client address; the server's rate limits need the real one.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine running: stopping it would end games in progress.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "gambit_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
